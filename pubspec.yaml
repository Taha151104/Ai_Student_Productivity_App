name: ai_student_productivity_app
description: "AI Student Productivity Ecosystem App - CS619 FYP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.3

  # OCR
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2

  # AI API calls
  http: ^1.2.2

  # URL launcher (support screen phone/email)
  url_launcher: ^6.3.0

  # State management
  provider: ^6.1.2

  # Local storage / offline
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # Print
  pdf: ^3.13.0
  printing: ^5.15.0
  # Notifications
  flutter_local_notifications: ^17.2.3

  # Voice input
  speech_to_text: ^7.0.0

  # Charts (Progress Tracking)
  fl_chart: ^0.69.0

  # Utilities & Mail
  intl: ^0.19.0
  uuid: ^4.5.1
  timezone: ^0.9.4
  mailer: ^7.2.0
  archive: ^4.0.9
  xml: ^7.0.1
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  pdfrx: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true